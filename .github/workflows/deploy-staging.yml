name: Deploy Ozzie Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ozzie-staging-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated demo repository
        uses: actions/checkout@v4
        with:
          path: preview

      - name: Checkout staging source
        uses: actions/checkout@v4
        with:
          repository: cjeius08/zoom-support-navigator
          ref: staging
          path: app
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Verify staging source
        working-directory: app
        run: |
          npm test -- --run
          npm run lint

      - name: Set staging Pages base
        working-directory: app
        run: |
          sed -i "s#base: '/zoom-support-navigator/'#base: '/ozzie-staging/legacy/'#" vite.config.js

      - name: Build isolated staging site
        working-directory: app
        env:
          VITE_STAGING_MODE: "true"
        run: npm run build

      - name: Assemble Visual Home preview and original dummy fallback
        run: |
          test -s preview/index.html
          grep -q 'ozzie-staging-preview' preview/index.html
          mkdir -p site/legacy
          cp preview/index.html site/index.html
          cp -a app/dist/. site/legacy/
          test -s site/legacy/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
